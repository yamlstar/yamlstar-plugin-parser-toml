name: Release TOML Parser Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.1.0
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-22.04
    steps:
    - name: Check out tag
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.version }}
        fetch-depth: 0

    - name: Check tag and version
      run: |
        [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        test "$(git rev-parse "$VERSION^{commit}")" = "$(git rev-parse HEAD)"
        grep -Fq "version: $VERSION" Meta
        grep -Fq ":version \"$VERSION\"" plugin.edn

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux-x64
          runner: ubuntu-22.04
        - platform: linux-aarch64
          runner: ubuntu-22.04-arm
        - platform: macos-x64
          runner: macos-15-intel
        - platform: macos-arm64
          runner: macos-15
    steps:
    - name: Check out tag
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.version }}

    - name: Install archive dependencies
      if: startsWith(matrix.platform, 'macos-')
      run: |
        brew list gnu-tar >/dev/null 2>&1 || brew install gnu-tar
        brew list xz >/dev/null 2>&1 || brew install xz

    - name: Build and test archive
      run: |
        make release-archive \
          VERSION="$VERSION" \
          RELEASE-PLATFORM="${{ matrix.platform }}" \
          TAR="${{ startsWith(matrix.platform, 'macos-') && 'gtar' || 'tar' }}"

    - name: Upload archive
      uses: actions/upload-artifact@v6
      with:
        name: release-${{ matrix.platform }}
        path: dist/*.tar.xz
        retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Download archives
      uses: actions/download-artifact@v7
      with:
        pattern: release-*
        path: release-output
        merge-multiple: true

    - name: Create checksums
      run: |
        cd release-output
        sha256sum *.tar.xz > SHA256SUMS

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$VERSION" release-output/* \
          --repo "$GITHUB_REPOSITORY" \
          --title "$VERSION" \
          --generate-notes
